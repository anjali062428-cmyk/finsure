services:
  # FinSure FastAPI Fraud Inference Engine
  - type: web
    name: finsure-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: "https://finsure.vercel.app,http://localhost:3000,http://localhost:5173"
      - key: AUTH_DB_PATH
        value: "/var/data/finsure_auth.db"
    disk:
      name: finsure-storage
      mountPath: /var/data
      sizeGB: 10
    healthCheckPath: /api/v1/health
